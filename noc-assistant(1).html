<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Treasury NOC Assistant</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
:root{
  --nav:#202123; --nav-hover:#343541; --page:#ffffff; --text:#2f2f2f; --muted:#6b6b6b;
  --bot:#f7f7f8; --user:#e8f3ff; --border:#e5e5e5; --accent:#10a37f;
  --shadow:0 2px 10px rgba(0,0,0,.06); --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--page);color:var(--text)}
.app{width:100%;height:100vh;display:flex;flex-direction:column;background:transparent;position:relative}
/* Fixed ChatGPT-style top navigation */
.header{position:fixed;top:0;left:0;right:0;height:64px;z-index:100;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border:0;border-radius:0;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.bot-icon{width:38px;height:38px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#fff}.bot-icon img{width:100%;height:100%;object-fit:cover;display:block}.bot-info{display:flex;flex-direction:column;gap:2px;min-width:0}.bot-title{font-size:16px;font-weight:600;color:#fff;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bot-status{display:flex;align-items:center;gap:6px;font-size:11px;color:#c5c5c5}.bot-status .status-dot{width:7px;height:7px;border-radius:50%;background:#10a37f;display:inline-block;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.header-actions{display:flex;align-items:center;gap:6px}.header-actions button,.header-actions a{padding:8px 10px;border:0;background:transparent;color:#ececec;font-size:17px;cursor:pointer;border-radius:8px;transition:.18s;text-decoration:none;display:flex;align-items:center;justify-content:center;line-height:1}.header-actions button:hover,.header-actions a:hover{background:var(--nav-hover);color:#fff}.header-actions .btn-change{background:#343541;color:#fff;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:600;gap:6px}.header-actions .btn-change:hover{background:#45464f}.header-actions .btn-change i{font-size:13px}
/* Transparent chat canvas */
.chat{flex:1;overflow-y:auto;min-height:0;padding:88px 0 150px;scroll-behavior:smooth;background:transparent}.chat::-webkit-scrollbar{width:8px}.chat::-webkit-scrollbar-track{background:transparent}.chat::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:99px}.chat::-webkit-scrollbar-thumb:hover{background:#aaa}
.message{display:flex;flex-direction:column;margin:0 0 22px;animation:fadeInUp .25s ease-out}.message.user{align-items:flex-end;padding-right:8%}.message.bot{align-items:flex-start;padding-left:8%}@keyframes fadeInUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.bubble{max-width:760px;width:fit-content;padding:13px 17px;border-radius:var(--radius);line-height:1.62;font-size:14px;word-wrap:break-word;overflow-wrap:anywhere;position:relative;box-shadow:none}.message.bot .bubble{background:var(--bot);border:1px solid #ededed;border-bottom-left-radius:5px;color:var(--text)}.message.user .bubble{background:var(--user);color:#1f2937;border:1px solid #d8e9f8;border-bottom-right-radius:5px;box-shadow:var(--shadow)}
.bubble-content{margin-bottom:6px}.bubble-content p{margin-bottom:6px}.bubble-content p:last-child{margin-bottom:0}.bubble-content strong{font-weight:650}.bubble-content a{color:#0b7f68;text-decoration:underline}.message.user .bubble-content a{color:#096b59}.bubble-footer{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#8a8a8a;opacity:.8;border-top:1px solid rgba(0,0,0,.08);padding-top:6px;margin-top:6px}.message.user .bubble-footer{color:#6f7e89;border-top-color:rgba(0,0,0,.08)}.bubble-footer .source{font-style:italic}.bubble-footer .timestamp{white-space:nowrap;font-variant-numeric:tabular-nums}
.suggestion-prompt{font-size:13px;font-weight:600;margin:12px 0 8px;color:#555}.suggestion-item{display:block;width:100%;padding:10px 13px;margin:6px 0;border-radius:9px;background:#fff;border:1px solid #e2e2e2;cursor:pointer;transition:.18s;font-size:13px;color:var(--text);text-align:left;font-family:inherit;line-height:1.4}.suggestion-item:hover{background:#f0f0f0;border-color:#c9c9c9;transform:none}.suggestion-item.none{background:transparent;border-color:transparent;color:#666}.suggestion-item.none:hover{background:#f5f5f5;border-color:transparent}.suggestion-item.no-answer-link{background:transparent;border:0;padding:8px 2px;color:#0b7f68;text-decoration:underline}.suggestion-item.no-answer-link:hover{background:transparent;color:#086a58}.suggestion-hint{margin-top:8px;font-size:12px;color:#8a8a8a}.query-id{margin-top:8px;padding:6px 10px;background:#eef8f5;border-radius:8px;font-size:11px;color:#777;display:inline-block}.query-id strong{font-weight:600;color:#0b8068}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 0}.typing span{width:7px;height:7px;border-radius:50%;background:#888;animation:typing 1.4s infinite ease-in-out}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
/* Floating bottom composer, like ChatGPT */
.composer{position:fixed;z-index:90;left:50%;bottom:18px;transform:translateX(-50%);width:min(860px,calc(100% - 120px));padding:0;display:flex;gap:8px;background:transparent;border:0}.input-wrapper{flex:1;position:relative;display:flex;align-items:center;background:#fff;border:1px solid #d9d9d9;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.10);transition:.18s;overflow:hidden}.input-wrapper:focus-within{border-color:#b7b7b7;box-shadow:0 4px 20px rgba(0,0,0,.13)}.question-input{flex:1;border:0;background:transparent;color:var(--text);padding:14px 16px;outline:none;resize:none;font-family:inherit;font-size:14px;min-height:50px;max-height:130px;line-height:1.5}.question-input::placeholder{color:#8a8a8a}.send-btn{width:40px;height:40px;border:0;border-radius:11px;background:#202123;color:#fff;cursor:pointer;font-size:17px;flex-shrink:0;transition:.18s;display:flex;align-items:center;justify-content:center;align-self:flex-end;margin:5px}.send-btn:hover:not(:disabled){background:#343541;transform:scale(1.03);box-shadow:none}.send-btn:active:not(:disabled){transform:scale(.96)}.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000;animation:fadeIn .2s ease-out}.modal-backdrop.show{display:flex}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.modal{width:100%;max-width:440px;background:#fff;border:1px solid #ddd;border-radius:18px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .25s ease-out}@keyframes slideUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}.modal-icon{width:50px;height:50px;border-radius:12px;background:#202123;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:15px;color:#fff}.modal h2{font-size:21px;font-weight:650;margin:0 0 6px;color:#222}.modal p{margin:0 0 22px;color:#666;font-size:14px;line-height:1.6}.field{margin-bottom:17px}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:#444}.field input{width:100%;border:1px solid #d8d8d8;background:#fff;color:#222;padding:12px 13px;border-radius:10px;outline:none;font-family:inherit;font-size:14px;transition:.18s}.field input:focus{border-color:#999;box-shadow:0 0 0 3px rgba(0,0,0,.06)}.br-help{margin-top:6px;color:#888;font-size:12px}.branch-info{margin-top:10px;padding:10px 13px;border-radius:8px;background:#f3f3f3;font-size:13px;color:#555;display:none}.branch-info.show{display:block}.modal-error{display:none;margin-bottom:15px;padding:11px 13px;border-radius:8px;background:#fff0f0;color:#c62828;font-size:13px;border:1px solid #ffd2d2}.modal-error.show{display:block}.btn-primary{width:100%;border:0;background:#202123;color:#fff;border-radius:10px;padding:13px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.18s}.btn-primary:hover:not(:disabled){background:#343541;transform:none;box-shadow:none}.btn-primary:disabled{opacity:.55;cursor:not-allowed}.btn-secondary{width:100%;margin-top:10px;border:1px solid #ddd;background:#fff;color:#555;border-radius:10px;padding:11px;font-family:inherit;font-size:13px;cursor:pointer}.btn-secondary:hover{background:#f5f5f5;border-color:#ccc;color:#222}
/* Desktop-only design: keep the layout intentionally fixed for desktop */
@media (max-width:900px){body{min-width:901px}.app{min-width:901px}.composer{width:780px}.message.user{padding-right:7%}.message.bot{padding-left:7%}}
</style>
</head>
<body>

<div class="app">

  <!-- ============================================================
       HEADER
  ============================================================ -->
  <header class="header">
    <div class="brand">
      <div class="bot-icon">
        <img src="./images/bot.png" alt="NOC Assistant">
      </div>
      <div class="bot-info">
        <div class="bot-title" id="botTitle">Treasury NOC Assistant</div>
        <div class="bot-status">
          <span class="status-dot"></span>
          <span id="botStatus">Online</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <a href="https://nocadmins.github.io/noc-assistant.html" target="_blank" title="Open in new window" aria-label="Open in new window">
        <i class="bi bi-box-arrow-up-right"></i>
      </a>
      <button class="btn-change" id="changeUserBtn">
        <i class="bi bi-arrow-repeat"></i>
        Switch
      </button>
    </div>
  </header>

  <!-- ============================================================
       CHAT
  ============================================================ -->
  <main class="chat" id="chat"></main>

  <!-- ============================================================
       COMPOSER
  ============================================================ -->
  <form class="composer" id="chatForm">
    <div class="input-wrapper">
      <textarea
        id="questionInput"
        class="question-input"
        placeholder="Ask a question, enter a topic, or type keywords..."
        rows="1"
        autocomplete="off"
      ></textarea>
    </div>
    <button class="send-btn" id="sendBtn" type="submit" title="Send message">
➤
    </button>
  </form>

</div>

<!-- ============================================================
     USER SETUP MODAL
============================================================ -->
<div class="modal-backdrop" id="userModal">
  <div class="modal">
    <div class="modal-icon">
      <i class="bi bi-person-plus"></i>
    </div>
    <h2>Welcome</h2>
    <p>Please enter your name and BR Code to start using the Treasury NOC Assistant.</p>

    <div class="field">
      <label for="nameInput">Your Name</label>
      <input id="nameInput" type="text" placeholder="Enter your full name" autocomplete="name">
    </div>

    <div class="field">
      <label for="brInput">BR Code</label>
      <input id="brInput" type="text" placeholder="e.g., BR0101 or 101" autocomplete="off">
      <div class="br-help">Accepts: BR0101, BR101, br101, BR 101, or 101</div>
      <div class="branch-info" id="branchInfo"></div>
    </div>

    <div class="modal-error" id="modalError"></div>

    <button class="btn-primary" id="saveUserBtn" type="button">Continue</button>
  </div>
</div>

<script>
  /* ============================================================
     CONFIGURATION
  ============================================================ */
  const API_URL = 'https://script.google.com/macros/s/AKfycbyLrbvP3jA6B1tDMnDfyAQbJ7MyfT122qDF93JvgrBYcR7aM29xTJHSOAaoP-5Bi7MH/exec';

  const STORAGE_KEYS = {
    NAME: 'treasury_chat_user_name',
    BR_CODE: 'treasury_chat_br_code',
    BRANCH: 'treasury_chat_branch'
  };

  /* ============================================================
     DOM REFS
  ============================================================ */
  const chat = document.getElementById('chat');
  const questionInput = document.getElementById('questionInput');
  const chatForm = document.getElementById('chatForm');
  const sendBtn = document.getElementById('sendBtn');
  const userModal = document.getElementById('userModal');
  const nameInput = document.getElementById('nameInput');
  const brInput = document.getElementById('brInput');
  const saveUserBtn = document.getElementById('saveUserBtn');
  const modalError = document.getElementById('modalError');
  const branchInfo = document.getElementById('branchInfo');
  const changeUserBtn = document.getElementById('changeUserBtn');
  const botTitle = document.getElementById('botTitle');

  /* ============================================================
     STATE
  ============================================================ */
  let userName = localStorage.getItem(STORAGE_KEYS.NAME) || '';
  let brCode = localStorage.getItem(STORAGE_KEYS.BR_CODE) || '';
  let branch = null;
  let waiting = false;
  let currentSuggestions = [];
  let isAwaitingSuggestionResponse = false;
  let pendingQuestion = '';
  let lastSubmittedQuestion = '';

  /* ============================================================
     INIT
  ============================================================ */
  document.addEventListener('DOMContentLoaded', function() {
    loadConfig();

    if (userName && brCode) {
      loadStoredBranch();
    } else {
      showUserModal();
    }

    questionInput.focus();
  });

  /* ============================================================
     LOAD CONFIG
  ============================================================ */
  function loadConfig() {
    jsonp('config', {}, function(response) {
      if (response && response.success && response.botName) {
        botTitle.textContent = response.botName;
      }
    });
  }

  /* ============================================================
     LOAD STORED BRANCH
  ============================================================ */
  function loadStoredBranch() {
    const storedBranch = localStorage.getItem(STORAGE_KEYS.BRANCH);
    if (storedBranch) {
      try {
        branch = JSON.parse(storedBranch);
      } catch (e) {
        branch = null;
      }
    }

    validateBranch(brCode, function(response) {
      if (response && response.success && response.valid) {
        branch = response.branch;
        localStorage.setItem(STORAGE_KEYS.BRANCH, JSON.stringify(branch));
        showWelcome();
      } else {
        localStorage.removeItem(STORAGE_KEYS.BRANCH);
        showUserModal();
      }
    });
  }

  /* ============================================================
     USER MODAL
  ============================================================ */
  function showUserModal() {
    modalError.classList.remove('show');
    modalError.textContent = '';
    nameInput.value = userName || '';
    brInput.value = brCode || '';
    branchInfo.classList.remove('show');
    userModal.classList.add('show');

    setTimeout(function() {
      if (!nameInput.value) {
        nameInput.focus();
      } else {
        brInput.focus();
      }
    }, 100);
  }

  function hideUserModal() {
    userModal.classList.remove('show');
  }

  /* ============================================================
     SAVE USER
  ============================================================ */
  saveUserBtn.addEventListener('click', saveUserDetails);

  function saveUserDetails() {
    const name = nameInput.value.trim();
    const enteredBR = brInput.value.trim();

    if (!name) {
      showModalError('Please enter your name.');
      nameInput.focus();
      return;
    }

    if (!enteredBR) {
      showModalError('Please enter your BR Code.');
      brInput.focus();
      return;
    }

    setModalLoading(true);

    validateBranch(enteredBR, function(response) {
      setModalLoading(false);

      if (!response || !response.success) {
        showModalError('Unable to validate BR Code. Please try again.');
        return;
      }

      if (!response.valid) {
        showModalError(response.message || 'Invalid or inactive BR Code.');
        return;
      }

      userName = name;
      brCode = response.branch.brCode;
      branch = response.branch;

      localStorage.setItem(STORAGE_KEYS.NAME, userName);
      localStorage.setItem(STORAGE_KEYS.BR_CODE, brCode);
      localStorage.setItem(STORAGE_KEYS.BRANCH, JSON.stringify(branch));

      hideUserModal();
      clearChat();
      showWelcome();
    });
  }

  /* ============================================================
     CHANGE USER
  ============================================================ */
  changeUserBtn.addEventListener('click', function() {
    nameInput.value = userName;
    brInput.value = brCode;
    modalError.classList.remove('show');
    branchInfo.classList.remove('show');
    userModal.classList.add('show');
    nameInput.focus();
  });

  /* ============================================================
     BR CODE INPUT
  ============================================================ */
  brInput.addEventListener('blur', function() {
    const value = brInput.value.trim();
    if (!value) return;

    validateBranch(value, function(response) {
      if (response && response.success && response.valid) {
        branchInfo.textContent = response.branch.branchName +
          (response.branch.district ? ' — ' + response.branch.district : '');
        branchInfo.classList.add('show');
      } else {
        branchInfo.classList.remove('show');
      }
    });
  });

  /* ============================================================
     VALIDATE BRANCH
  ============================================================ */
  function validateBranch(value, callback) {
    jsonp('validatebranch', { brCode: value }, callback);
  }

  /* ============================================================
     WELCOME
  ============================================================ */
  function showWelcome() {
    const branchName = branch && branch.branchName ? branch.branchName : 'your branch';
    addBotMessage(
      'Hello <strong>' + escapeHtml(userName) + '</strong>!<br><br>' +
      'You are connected to <strong>' + escapeHtml(branchName) + '</strong> ' +
      '(' + escapeHtml(brCode) + ').<br><br>' +
      'How can I help you today?'
    );
  }

  /* ============================================================
     CHAT SUBMIT
  ============================================================ */
  chatForm.addEventListener('submit', function(event) {
    event.preventDefault();
    if (isAwaitingSuggestionResponse) {
      handleSuggestionResponse();
    } else {
      sendQuestion();
    }
  });

  /* ============================================================
     ENTER KEY
  ============================================================ */
  questionInput.addEventListener('keydown', function(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      if (isAwaitingSuggestionResponse) {
        handleSuggestionResponse();
      } else {
        sendQuestion();
      }
    }
  });

  /* ============================================================
     HANDLE SUGGESTION RESPONSE
  ============================================================ */
  function handleSuggestionResponse() {
    const input = questionInput.value.trim();
    if (!input) return;

    const match = input.match(/^(?:question\s*)?(\d+)$/i);
    const noneNumber = currentSuggestions.length + 1;

    if (!match) {
      isAwaitingSuggestionResponse = false;
      currentSuggestions = [];
      pendingQuestion = '';
      questionInput.placeholder = 'Ask a question, enter a topic, or type keywords...';
      sendQuestion();
      return;
    }

    const selectedNumber = parseInt(match[1], 10);

    if (selectedNumber === noneNumber) {
      addUserMessage(escapeHtml(input));
      submitUnansweredQuery(pendingQuestion);
      return;
    }

    if (selectedNumber < 1 || selectedNumber > currentSuggestions.length) {
      addBotMessage('Please provide a question number within the range 1-' + noneNumber + '.');
      questionInput.value = '';
      questionInput.focus();
      return;
    }

    const suggestion = currentSuggestions[selectedNumber - 1];
    addUserMessage(escapeHtml(input));
    sendSuggestedQuestion(suggestion.question);
  }

  function sendSuggestedQuestion(suggestedQuestion) {
    isAwaitingSuggestionResponse = false;
    currentSuggestions = [];
    pendingQuestion = '';
    questionInput.value = '';
    questionInput.placeholder = 'Ask a question, enter a topic, or type keywords...';
    autoResize();

    const typingId = showTyping();
    waiting = true;
    sendBtn.disabled = true;

    jsonp('askexact', {
      name: userName,
      brCode: brCode,
      question: suggestedQuestion
    }, function(response) {
      removeTyping(typingId);
      waiting = false;
      sendBtn.disabled = false;

      if (!response) {
        addBotMessage('Unable to contact the chatbot server.');
        return;
      }

      if (!response.success) {
        addBotMessage(escapeHtml(response.error || 'Unable to process your question.'));
        return;
      }

      if (response.answered === true) {
        lastSubmittedQuestion = suggestedQuestion;
        renderAnswer(response);
        return;
      }

      if (response.suggestions && response.suggestions.length > 0) {
        showSuggestions(response.suggestions, suggestedQuestion);
        return;
      }

      let html = escapeHtml(response.answer || 'Sorry, I could not find a suitable answer.');
      if (response.queryId) {
        html += '<div class="query-id">Query ID: <strong>' + escapeHtml(response.queryId) + '</strong></div>';
      }
      addBotMessage(html);
    });
  }

  /* ============================================================
     SUBMIT UNANSWERED QUERY
  ============================================================ */
  function submitUnansweredQuery(question) {
    isAwaitingSuggestionResponse = false;
    currentSuggestions = [];
    pendingQuestion = '';
    questionInput.placeholder = 'Ask a question, enter a topic, or type keywords...';

    waiting = true;
    sendBtn.disabled = true;

    jsonp('unanswered', {
      name: userName,
      brCode: brCode,
      question: question
    }, function(response) {
      waiting = false;
      sendBtn.disabled = false;
      questionInput.value = '';
      autoResize();
      questionInput.focus();

      if (!response) {
        addBotMessage('Unable to contact the chatbot server.');
        return;
      }

      if (!response.success) {
        addBotMessage(escapeHtml(response.error || 'Unable to submit your question.'));
        return;
      }

      let html = 'Your question has been sent for review.';
      if (response.queryId) {
        html += '<div class="query-id">Query ID: <strong>' + escapeHtml(response.queryId) + '</strong></div>';
      }
      addBotMessage(html);
    });
  }

  /* ============================================================
     SEND QUESTION
  ============================================================ */
  function sendQuestion() {
    if (waiting) return;

    isAwaitingSuggestionResponse = false;
    currentSuggestions = [];
    questionInput.placeholder = 'Ask a question, enter a topic, or type keywords...';

    const question = questionInput.value.trim();
    lastSubmittedQuestion = question;

    if (!question) return;

    if (!userName || !brCode) {
      showUserModal();
      return;
    }

    addUserMessage(escapeHtml(question));
    questionInput.value = '';
    autoResize();

    const typingId = showTyping();
    waiting = true;
    sendBtn.disabled = true;

    jsonp('ask', {
      name: userName,
      brCode: brCode,
      question: question
    }, function(response) {
      removeTyping(typingId);
      waiting = false;
      sendBtn.disabled = false;

      if (!response) {
        addBotMessage('Unable to contact the chatbot server.');
        return;
      }

      if (!response.success) {
        addBotMessage(escapeHtml(response.error || 'Unable to process your question.'));
        return;
      }

      if (response.answered === true) {
        renderAnswer(response);
        return;
      }

      if (response.suggestions && response.suggestions.length > 0) {
        showSuggestions(response.suggestions, question);
        return;
      }

      let html = escapeHtml(response.answer || 'Sorry, I could not find a suitable answer.');
      if (response.queryId) {
        html += '<div class="query-id">Query ID: <strong>' + escapeHtml(response.queryId) + '</strong></div>';
      }
      addBotMessage(html);
    });
  }

  /* ============================================================
     SHOW SUGGESTIONS
  ============================================================ */
  function showSuggestions(suggestions, originalQuestion) {
    isAwaitingSuggestionResponse = true;
    currentSuggestions = suggestions || [];
    pendingQuestion = originalQuestion || '';

    let html = '<br><hr><div class="suggestion-prompt">See also — related questions:</div>';

    currentSuggestions.forEach(function(suggestion, index) {
      const num = index + 1;
      html +=
        '<button type="button" class="suggestion-item suggestion-question" data-suggestion-index="' + index + '">' +
        '<strong>' + num + '.</strong> ' + escapeHtml(suggestion.question || 'Question ' + num) +
        '</button>';
    });

    html +=
      '<button type="button" class="suggestion-item none no-answer-link" data-no-exact-answer="1">' +
      'I can\'t find what I\'m looking for' +
      '</button>';

    html += '<div class="suggestion-hint">Click a related question above or type a new question.</div>';

    addBotMessage(html);
    bindSuggestionPanel_();
    questionInput.focus();
    questionInput.placeholder = 'Click a related question or type...';
  }

  function bindSuggestionPanel_() {
    const suggestionButtons = chat.querySelectorAll('[data-suggestion-index]');
    suggestionButtons.forEach(function(button) {
      button.addEventListener('click', function() {
        const index = parseInt(button.getAttribute('data-suggestion-index'), 10);
        if (isNaN(index) || !currentSuggestions[index]) return;

        const suggestion = currentSuggestions[index];
        addUserMessage(escapeHtml(suggestion.question || 'Question ' + (index + 1)));
        sendSuggestedQuestion(suggestion.question);
      });
    });

    const buttons = chat.querySelectorAll('[data-no-exact-answer="1"]');
    const button = buttons[buttons.length - 1];
    if (button) {
      button.addEventListener('click', function() {
        const question = pendingQuestion;
        addUserMessage('I can\'t find what I\'m looking for');
        submitUnansweredQuery(question);
      });
    }
  }

  /* ============================================================
     RENDER ANSWER
  ============================================================ */
  function renderAnswer(response) {
    let answer = response.answer || '';
    let sourceInfo = '';

    if (response.matchType === 'EXACT') {
      sourceInfo = 'Showing result for: Exact Question Match';
    } else if (response.matchType === 'EXTERNAL') {
      sourceInfo = response.lookupBR
        ? 'Showing result for: ' + response.lookupBR + ' (External Source)'
        : 'Showing result for: External Source';
    } else if (response.matchType === 'BRANCH_LOOKUP' || response.lookupBR) {
      sourceInfo = 'Showing result for: ' + (response.lookupBR || brCode);
    } else if (response.matchType === 'KEYWORD') {
      sourceInfo = 'Showing result for: Keyword Match';
    } else if (response.source === 'External_Sources') {
      sourceInfo = response.lookupBR
        ? 'Showing result for: ' + response.lookupBR + ' (External Source)'
        : 'Showing result for: External Source';
    } else {
      sourceInfo = 'Showing result for: ' + (response.lookupBR || brCode);
    }

    let contentHtml;
    if (String(response.answerType || '').toUpperCase() === 'HTML') {
      contentHtml = answer;
    } else {
      contentHtml = escapeHtml(answer).replace(/\n/g, '<br>');
    }

    if (response.suggestions && response.suggestions.length > 0) {
      contentHtml += buildSuggestionHtml_(response.suggestions);
    }

    addBotMessageWithSource(contentHtml, sourceInfo, 'HTML');

    if (response.suggestions && response.suggestions.length > 0) {
      bindSuggestionPanel_();
    }
  }

  function buildSuggestionHtml_(suggestions) {
    currentSuggestions = suggestions || [];
    pendingQuestion = lastSubmittedQuestion;
    isAwaitingSuggestionResponse = true;

    let html = '<br><br><div style="border-top: 1px solid rgba(128, 128, 128, 0.15);"></div><div  class="suggestion-prompt">See also — related questions:</div>';

    currentSuggestions.forEach(function(suggestion, index) {
      const num = index + 1;
      html +=
        '<button type="button" class="suggestion-item suggestion-question" data-suggestion-index="' + index + '">' +
        '<strong>' + num + '.</strong> ' + escapeHtml(suggestion.question || 'Question ' + num) +
        '</button>';
    });

    html +=
      '<button type="button" class="suggestion-item none no-answer-link" data-no-exact-answer="1">' +
      'I can\'t find what I\'m looking for' +
      '</button>';

    html += '<div class="suggestion-hint"> </div>';

    return html;
  }

  /* ============================================================
     ADD USER MESSAGE
  ============================================================ */
  function addUserMessage(html) {
    const wrapper = document.createElement('div');
    wrapper.className = 'message user';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const content = document.createElement('div');
    content.className = 'bubble-content';
    content.innerHTML = html;
    bubble.appendChild(content);

    const footer = document.createElement('div');
    footer.className = 'bubble-footer';

    const leftSpan = document.createElement('span');
    leftSpan.style.visibility = 'hidden';
    leftSpan.textContent = ' ';

    const timestampSpan = document.createElement('span');
    timestampSpan.className = 'timestamp';
    timestampSpan.textContent = getCurrentTimestamp();

    footer.appendChild(leftSpan);
    footer.appendChild(timestampSpan);
    bubble.appendChild(footer);

    wrapper.appendChild(bubble);
    chat.appendChild(wrapper);
    scrollChat();
  }

  /* ============================================================
     ADD BOT MESSAGE
  ============================================================ */
  function addBotMessage(html) {
    const wrapper = document.createElement('div');
    wrapper.className = 'message bot';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const content = document.createElement('div');
    content.className = 'bubble-content';
    content.innerHTML = html;
    bubble.appendChild(content);

    const footer = document.createElement('div');
    footer.className = 'bubble-footer';

    const leftSpan = document.createElement('span');
    leftSpan.style.visibility = 'hidden';
    leftSpan.textContent = ' ';

    const timestampSpan = document.createElement('span');
    timestampSpan.className = 'timestamp';
    timestampSpan.textContent = getCurrentTimestamp();

    footer.appendChild(leftSpan);
    footer.appendChild(timestampSpan);
    bubble.appendChild(footer);

    wrapper.appendChild(bubble);
    chat.appendChild(wrapper);
    scrollChat();
  }

  /* ============================================================
     ADD BOT MESSAGE WITH SOURCE
  ============================================================ */
  function addBotMessageWithSource(html, sourceInfo, answerType) {
    const wrapper = document.createElement('div');
    wrapper.className = 'message bot';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const content = document.createElement('div');
    content.className = 'bubble-content';

    if (answerType && answerType.toUpperCase() === 'HTML') {
      content.innerHTML = html;
    } else {
      content.innerHTML = html;
    }
    bubble.appendChild(content);

    const footer = document.createElement('div');
    footer.className = 'bubble-footer';

    const sourceSpan = document.createElement('span');
    sourceSpan.className = 'source';
    sourceSpan.textContent = sourceInfo;

    const timestampSpan = document.createElement('span');
    timestampSpan.className = 'timestamp';
    timestampSpan.textContent = getCurrentTimestamp();

    footer.appendChild(sourceSpan);
    footer.appendChild(timestampSpan);
    bubble.appendChild(footer);

    wrapper.appendChild(bubble);
    chat.appendChild(wrapper);
    scrollChat();
  }

  /* ============================================================
     TIMESTAMP
  ============================================================ */
  function getCurrentTimestamp() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();
    return hours + ':' + minutes + ':' + seconds + ' • ' + day + '/' + month + '/' + year;
  }

  /* ============================================================
     TYPING
  ============================================================ */
  function showTyping() {
    const id = 'typing-' + Date.now();
    const wrapper = document.createElement('div');
    wrapper.className = 'message bot';
    wrapper.id = id;
    wrapper.innerHTML =
      '<div class="bubble">' +
        '<div class="typing">' +
          '<span></span><span></span><span></span>' +
        '</div>' +
      '</div>';
    chat.appendChild(wrapper);
    scrollChat();
    return id;
  }

  function removeTyping(id) {
    const element = document.getElementById(id);
    if (element) element.remove();
  }

  /* ============================================================
     UTILITIES
  ============================================================ */
  function clearChat() {
    chat.innerHTML = '';
  }

  function scrollChat() {
    setTimeout(function() {
      chat.scrollTop = chat.scrollHeight;
    }, 20);
  }

  function autoResize() {
    questionInput.style.height = 'auto';
    questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + 'px';
  }

  questionInput.addEventListener('input', autoResize);

  function showModalError(message) {
    modalError.textContent = message;
    modalError.classList.add('show');
  }

  function setModalLoading(loading) {
    saveUserBtn.disabled = loading;
    saveUserBtn.textContent = loading ? 'Validating...' : 'Continue';
  }

  /* ============================================================
     JSONP CLIENT
  ============================================================ */
  function jsonp(action, params, callback) {
    if (!API_URL || API_URL === 'YOUR_APPS_SCRIPT_WEB_APP_URL') {
      callback({
        success: false,
        error: 'Apps Script API URL has not been configured.'
      });
      return;
    }

    const callbackName = 'treasuryCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    const script = document.createElement('script');
    const query = new URLSearchParams();

    query.set('action', action);
    query.set('callback', callbackName);

    Object.keys(params || {}).forEach(function(key) {
      query.set(key, params[key]);
    });

    const timeout = setTimeout(function() {
      cleanup();
      callback({
        success: false,
        error: 'The server did not respond in time.'
      });
    }, 30000);

    window[callbackName] = function(data) {
      clearTimeout(timeout);
      cleanup();
      callback(data);
    };

    script.onerror = function() {
      clearTimeout(timeout);
      cleanup();
      callback({
        success: false,
        error: 'Unable to connect to the chatbot API.'
      });
    };

    script.src = API_URL + (API_URL.indexOf('?') >= 0 ? '&' : '?') + query.toString();
    document.head.appendChild(script);

    function cleanup() {
      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }
      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }
  }

  /* ============================================================
     HTML ESCAPE
  ============================================================ */
  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
